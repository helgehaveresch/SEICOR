date: "250412"

base_paths:
  windows: "D:\\SEICOR"
  linux: "/misc/dodecagon/BREDOM/SEICOR"

bredom_paths: # the corrected LIDAR file (lidar_file) is read from here
  windows: "Q:\\BREDOM\\SEICOR"
  linux: "/misc/dodecagon/BREDOM/SEICOR"

Instruments: #relative to base_paths
  IMPACT_SC_path: "IMPACT/SLANT_{yy}" #{yy} is the year of the date (250412 -> SLANT_25), month folder is added automatically using the date
  IMPACT_SC_file_ending: "ID.NO2_VIS_daily_ref"
  drop_lowest_viewing_directions: 5 # number of lowest viewing directions (VEA -3.0 to 0.2 deg) removed right after reading; row numbers in the settings below stay the original ones
  do_reference_correction: false
  SC_reference_offset_correction_files: "_D.NO2_VIS_fix_ref_250907"
  lp_doas_dir: "Open_Path/SpectralAnalysis/results"
  in_situ_path: "InSitu/HORIBA"
  airpointer_path: "InSitu/Airpointer" # wind is taken from the Airpointer, gases from the HORIBA
  meteomast_path: "weatherstations/Billwerder" # Uni Hamburg meteomast, wind at 50/110/175/280 m
  median_wind_file: "weatherstations/Median_winddata/median_winddata_hourly.csv" # hourly median wind of the weather stations (currently not used)
  ais_dir: "AIS"
  img_dir: "IMPACT/video" # directory containing daily zipped video files
  weather_stations_dir: "weatherstations"
  era5_dir: "ERA5" # monthly GRIB files from download_era_5.py
  era5_max_height_m: 500 # ERA5 model levels up to this height above ground are stored in the plume files
  lidar_file: "wind_LIDAR/lidar_flip_corrected.csv" # relative to bredom_paths; written by wind_model_meteomast_lidar_comparison.py; 2026 LIDAR only, the 2025 data is not used
  ship_corridor_location: # ERA5 profile is interpolated to this point
    - 53.56634576422346
    - 9.690192228678288
  instrument_location:
    - 53.56958522848946
    - 9.69174249821205

processing:
  ais_filter:
    interpolation_limit: 60 #seconds
    lat_lon_window: # [lat_min, lat_max, lon_min, lon_max] area of interest for ais data
      - 53.4
      - 53.8
      - 9.3
      - 10.0
    lat_lon_window_small:
      - 53.55
      - 53.60
      - 9.6
      - 9.8
    max_ship_length: 20 #in meters
    distance_threshold: 0.002 #minimum ship distance in degrees from the instrument LOS
    close_pass_minutes: 3 # two passes within this time show the same images:
    close_pass_small_length_m: 60 # ... then the pass of the smaller ship is dropped if it is shorter than this

  coarsen: # IMPACT measurements are averaged in fixed time bins right after reading, before any processing; saved to Output/impact_coarsened_out_dir
    time_resolution_seconds: 1.5 # bin length (bins aligned to midnight UTC, empty bins dropped); null = no coarsening. Settings below that count measurements or pixels stay in RAW measurements; the preprocessor divides them by the raw measurements per bin (impact.SAMPLE_COUNT_SETTINGS)

  quality:
    min_rms_IMPACT: 0.01 #not applied in ervery operation!
    min_rms_lp_doas: 0.0005
    rolling_mean_window: 40

  enhancement:
    calculate_rolling_background: true
    rolling_background_window: 500
    calculate_polynomial_background: true
    polynomial_background_degree: 8
    calculate_high_pass_fft_background: true
    high_pass_filter_time_period: 3000 # in seconds
    run_upwind_doas_fit: false
    nlin_param_file: pars/nlin_d/SEICOR_D_offaxis.NO2_VIS_upwind

  plume_window: # time window around the ship pass that is stored and analysed
    before_minutes: 1
    after_minutes: 3
    extend_step_minutes: 2 # if the plume mask touches the left/right edge, extend the window on that side by this and mask again; only in one direction per pass (the side of the first extension)
    max_extensions: 5 # maximum number of extension steps

  reference_search: # clean up- and downwind reference windows (enhancements.find_reference_window)
    start_offset_minutes: 1 # gap between plume window and reference: upwind ends this long before the start, downwind starts this long after the end of the plume window
    search_minutes: 60 # search up to this far from the pass, in 30 s steps
    window_minutes: 1 # length of the reference window
    min_count: 100 # minimum number of measurements in the reference window
    min_span_seconds: 40 # minimum time covered by these measurements
    other_ship_minutes: null # no other ship pass within this time of the reference window; null/0 = no check (a reference may contain other ships' plumes anyway, only the z-test below excludes plume structure)
    other_ship_min_length_m: 70 # only other ships longer than this block a reference window (unknown length always blocks); null = all ships
    ztest_p_threshold: 0.16 # z-test that must find no plume in the reference window
    ztest_min_cluster_size: 60

  detection: # plume / ship flag (plumes.sort_plumes)
    p_threshold_plume: 0.02
    p_threshold_ship: 0.02
    time_tolerance_seconds: 60 # searched within +- this time around the pass
    plume_rows: [8, 20] # image rows (VEA) searched for the plume, python slice [start, stop)
    ship_rows: [4, 10] # image rows searched for the ship itself
    plume_min_cluster_size: 5 # minimum plume cluster size in pixels (raw measurements)
    ship_min_cluster_size: 20 # minimum ship cluster size in pixels (raw measurements)

  plume_mask: # plume_mask stored in the plume files (only for passes with a plume or ship found), iterative z-test (plumes.detect_plume_ztest_iterative)
    p_threshold: 0.16
    min_cluster_size: 30 # in pixels of the (coarsened) image, NOT scaled with the coarsening
    kernel_arm: 1
    connectivity: 1
    merge_max_gap_seconds: 15 # clusters at most this far apart in time on similar rows become one cluster; null switches this off
    merge_max_row_distance: 2 # rows at most this far apart count as similar elevation angles
    merge_min_cluster_size: 70 # only clusters with at least this many pixels are merged
    merge_max_cluster_size: 200 # only clusters with at most this many pixels are merged, whether source-connected or neighbouring; null means no limit
    merge_max_extension_minutes: 5 # merged clusters reach at most this far before or after the source-connected cluster; null means no limit
    require_connection: true
    ship_p_threshold: 0.02 # left-sided test for the ship (negative dSCDs), as p_threshold_ship in detection
    ship_min_cluster_size: 20 # as in the ship detection of sort_plumes
    max_iter: 10 # first iteration uses the reference statistics, the following ones the re-estimated background
    stop_pixels: 15 # stop when the plume|ship mask changes by at most this many pixels
    bg_include_references: false # re-estimated background = reference pixels + plume-window pixels outside plume and ship
    bg_offset_from_window: true # background level from the plume window itself (median, then pixels outside plume/ship), so an offset of the whole window against the references is not plume
    min_background_fraction: 0.3 # after masking, the mean of the enhancement image outside plume and ship is subtracted (warning if mean > std) if at least this fraction of the pixels lies outside plume and ship

Output:
  plots_out_dir: "analysis_test"
  img_out_dir: "video_test"
  ship_passes_out_dir: "ship_passes_test"
  plume_out_dir: "plumes_test"
  impact_coarsened_out_dir: "IMPACT_coarsened" # IMPACT_<date>_<time_resolution>s.nc, only written if coarsened

Plotting:
  generate_plots: true
